name: Generate Pac-Man Contribution Graph

on:
  schedule:
    - cron: "0 */12 * * *"       # every 12 hours
  workflow_dispatch:             # allows manual trigger from Actions tab
  # push:                        # optional - uncomment if you want on every push
  #   branches: [main]

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4           # ← this was probably missing → very important!

      - name: Generate pacman-contribution-graph.svg
        uses: abozanona/pacman-contribution-graph@v2.3.0   # ← latest stable version Oct 2025
        with:
          github_user_name: ${{ github.repository_owner }}   # your username (Senal)

      - name: Prepare files for deployment
        run: |
          mkdir -p dist
          mv pacman-contribution-graph*.svg dist/  2>/dev/null || true

      - name: Deploy to output branch
        uses: crazy-max/ghaction-github-pages@v4           # ← updated & more reliable in 2025/2026
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: update Pac-Man contribution graph"
          allow_empty_commit: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
